<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>6·25 하늘의 작전 — F-51 비행 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14212B; --snow:#E9EEF1; --red:#C8372D; --brass:#D9A441; --paper:#E2DCCB; --paper-ink:#2A2620; --steel:#2E4A62;
  --glass:rgba(16,26,34,.66);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#DAD3C0; } }
:root[data-theme="dark"]{ --paper:#DAD3C0; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--ink);color:var(--snow);overflow:hidden;
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#gl,#hud2d{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud2d{pointer-events:none}
.display,.btn,h1,h2{font-family:"Black Han Sans","Apple SD Gothic Neo",sans-serif;font-weight:400}

.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto;touch-action:pan-y}
.screen.on{display:flex}

#title{justify-content:flex-start;align-items:flex-end;background:linear-gradient(90deg,rgba(14,22,30,.82) 0%,rgba(14,22,30,.35) 55%,rgba(14,22,30,0) 100%)}
#title .wrap{max-width:560px;padding:0 0 6vh 4vw}
#title h1{word-break:keep-all;font-size:clamp(44px,9vw,104px);line-height:.98;margin:0}
#title h1 small{display:block;font-size:.34em;color:var(--brass);margin-bottom:.35em}
#title p{font-size:clamp(15px,2.2vw,19px);line-height:1.7;margin:16px 0 26px;color:#d6e0e7;max-width:30em}

.btn{font-size:clamp(17px,2.6vw,21px);border:0;border-radius:6px;padding:13px 26px;cursor:pointer;background:var(--brass);color:var(--ink);box-shadow:0 4px 0 #8f6a22}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8f6a22}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}

#select{background:rgba(14,22,30,.55);flex-direction:column;gap:18px}
#select h2{font-size:clamp(26px,5vw,40px);margin:0;text-align:center}
.missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;width:min(900px,100%)}
.mcard{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:22px;text-align:left;border:0;cursor:pointer;font:inherit;
  box-shadow:0 14px 30px rgba(0,0,0,.4);position:relative;display:flex;flex-direction:column;gap:8px}
.mcard:nth-child(1){transform:rotate(-.6deg)} .mcard:nth-child(2){transform:rotate(.5deg)}
.mcard h3{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:26px;margin:0}
.mcard .d{color:#6d6556;font-size:15px}
.mcard p{margin:4px 0 0;font-size:16px;line-height:1.6}
.mcard .done{position:absolute;top:14px;right:14px;border:3px solid var(--red);color:var(--red);font-family:"Black Han Sans";padding:2px 8px;transform:rotate(8deg);display:none}
.mcard.cleared .done{display:block}
.mcard svg{width:100%;height:90px;display:block;margin-bottom:4px}

.order{background:var(--paper);color:var(--paper-ink);max-width:640px;width:100%;padding:clamp(22px,4vw,38px);border-radius:3px;position:relative;
  box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(-.3deg);margin:auto}
.order .stamp{position:absolute;top:18px;right:18px;border:3px solid var(--red);color:var(--red);font-family:"Black Han Sans";padding:4px 10px;transform:rotate(8deg);font-size:15px;opacity:.85}
.order h2{font-size:clamp(25px,4.6vw,34px);margin:0 0 4px;padding-right:90px}
.order .date{color:#6d6556;margin:0 0 16px;font-size:15px}
.order p,.order li{font-size:clamp(15.5px,2.2vw,17.5px);line-height:1.75}
.order ul{padding-left:1.2em;margin:.4em 0}
.order mark{background:none;color:var(--red);font-weight:700}
.order .btn{box-shadow:0 4px 0 #6b5a3a}
.order kbd{font-family:inherit;border:1.5px solid #8d846f;border-radius:4px;padding:0 5px;font-size:.92em}
.row{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:#bdb5a1}.dots i.on{background:var(--red)}
.mapsvg{width:100%;height:auto;display:block;margin:4px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat div{border:2px solid #b9b09a;border-radius:4px;padding:10px}
.stat b{display:block;font-family:"Black Han Sans";font-weight:400;font-size:24px}
.stat small{color:#6d6556;font-size:13px}
.crew{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:15.5px;margin:6px 0}
.note{font-size:13.5px!important;color:#6d6556}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:17px;padding:12px 14px;margin:8px 0;border:2px solid #b9b09a;border-radius:4px;background:#efe9da;color:var(--paper-ink);cursor:pointer}
.opt.ok{border-color:#3d7a4a;background:#d7e6d3}.opt.no{border-color:var(--red);background:#efd3cd}
.fb{min-height:3em;font-size:16px;line-height:1.6}

/* HUD */
#hud{position:absolute;inset:0;display:none;pointer-events:none}
#hud.on{display:block}
.panel{background:var(--glass);border-radius:6px;padding:8px 12px;font-size:13.5px;line-height:1.4;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#obj{position:absolute;left:12px;top:12px;max-width:min(46vw,330px)}
#obj b{font-family:"Black Han Sans";font-weight:400;font-size:17px;color:var(--brass);display:block}
#defbar{height:7px;background:#4a5761;border-radius:4px;margin-top:6px;overflow:hidden;display:none}
#defbar i{display:block;height:100%;width:100%;background:#7fbf8a}
#inst{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:4px;padding:6px 8px}
#inst div{text-align:center;min-width:62px;padding:0 4px}
#inst b{display:block;font-family:"Black Han Sans";font-weight:400;font-size:21px;font-variant-numeric:tabular-nums;color:var(--snow)}
#inst small{font-size:11.5px;color:#a9b8c3}
#dmg{width:56px;height:7px;background:#4a5761;border-radius:4px;margin:7px auto 4px;overflow:hidden}
#dmg i{display:block;height:100%;width:100%;background:var(--brass)}
#mini{position:absolute;right:12px;top:12px;width:120px;height:120px;border-radius:50%;background:rgba(16,26,34,.6)}
#ammo{position:absolute;right:12px;top:140px;text-align:right}
#radio{position:absolute;left:12px;bottom:calc(178px + env(safe-area-inset-bottom,0px));max-width:min(70vw,420px);display:none}
#radio.on{display:block}
#radio b{color:var(--brass);font-weight:700}
#toast{position:absolute;left:50%;top:28%;transform:translateX(-50%);width:90%;text-align:center;font-family:"Black Han Sans";font-size:clamp(24px,5vw,40px);
  text-shadow:0 2px 10px rgba(0,0,0,.7);opacity:0;transition:opacity .3s}
#toast small{display:block;font-family:"Gowun Dodum";font-size:.46em;margin-top:6px}
#toast.on{opacity:1}
#warn{position:absolute;left:50%;top:64%;transform:translateX(-50%);font-family:"Black Han Sans";font-size:22px;color:#ff9c8c;text-shadow:0 2px 6px #000;display:none}

/* touch controls */
#touch{position:absolute;inset:0;display:none;pointer-events:none}
#touch.on{display:block}
#stick{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;
  background:rgba(16,26,34,.45);box-shadow:inset 0 0 0 2px rgba(233,238,241,.35);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(233,238,241,.85);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;border:0;border-radius:50%;font-family:"Black Han Sans";color:#fff;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#bA{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:96px;height:96px;background:var(--red)}
#bG{right:calc(128px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:76px;height:76px;background:#4e5d52}
#bTu,#bTd{right:calc(22px + env(safe-area-inset-right,0px));width:52px;height:46px;border-radius:8px;background:rgba(16,26,34,.7);font-size:15px}
#bTu{bottom:calc(196px + env(safe-area-inset-bottom,0px))}#bTd{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
#bV{right:calc(84px + env(safe-area-inset-right,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px));width:60px;height:46px;border-radius:8px;background:rgba(16,26,34,.7);font-size:15px}
#pauseBtn{position:absolute;left:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));pointer-events:auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--glass);color:#fff;font-size:16px;display:none}
#touch.on ~ #pauseBtn{left:auto;right:12px;top:256px;bottom:auto}
#pause{background:rgba(14,22,30,.6)}
#fsHud{position:absolute;left:64px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:var(--glass);color:#fff;font-size:18px;display:none}
#touch.on ~ #fsHud{left:auto;right:12px;top:308px;bottom:auto}
#helpHud{position:absolute;left:116px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:44px;min-width:44px;padding:0 14px;border-radius:22px;border:0;background:var(--brass);color:var(--ink);font-family:"Black Han Sans";font-size:18px;display:none;box-shadow:0 3px 0 #8f6a22}
#touch.on ~ #helpHud{left:auto;right:12px;top:360px;bottom:auto}
#help{background:rgba(14,22,30,.6)}
.hgrid{display:grid;grid-template-columns:1.1fr 1fr 1fr;border:2px solid #b9b09a;border-radius:4px;overflow:hidden;margin:10px 0}
.hgrid div{padding:9px 10px;border-top:1px solid #cfc6b0;font-size:15.5px;line-height:1.45}
.hgrid .h{background:#d4ccb6;border-top:0;font-family:"Black Han Sans";font-size:15px}
.hgrid .a{font-weight:700}
.pitchfig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.pitchfig figure{margin:0;border:2px solid #b9b09a;border-radius:4px;padding:8px;text-align:center;font-size:15px}
.pitchfig svg{width:100%;height:auto;display:block}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #c9c0aa;font-size:16px}
.toggle button{font:inherit;border:2px solid #8d846f;background:#efe9da;border-radius:20px;padding:4px 14px;cursor:pointer;color:var(--paper-ink)}
.toggle button[aria-pressed="true"]{background:var(--paper-ink);color:var(--paper)}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);font-size:18px;z-index:9}
@media (max-width:620px){ #inst div{min-width:48px} #inst b{font-size:17px} #obj{top:76px;max-width:60vw} #mini{width:96px;height:96px} #ammo{top:114px} }
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="hud2d"></canvas>
  <div id="loading">비행장 준비 중…</div>

  <div id="hud">
    <div class="panel" id="obj"><b id="objT">목표</b><span id="objS"></span><div id="defbar"><i></i></div></div>
    <div class="panel" id="inst">
      <div><b id="iSpd">0</b><small>속도 kt</small></div>
      <div><b id="iAlt">0</b><small>고도 ft</small></div>
      <div><b id="iHdg">000</b><small>방위</small></div>
      <div><b id="iThr">70</b><small>추력 %</small></div>
      <div><div id="dmg"><i></i></div><small>기체</small></div>
    </div>
    <canvas id="mini" width="240" height="240"></canvas>
    <div class="panel" id="ammo"></div>
    <div class="panel" id="radio"><b id="rWho"></b> <span id="rTxt"></span></div>
    <div id="toast"></div>
    <div id="warn"></div>
  </div>

  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <button class="tbtn" id="bA">투하</button>
    <button class="tbtn" id="bG">기총</button>
    <button class="tbtn" id="bTu">추력▲</button>
    <button class="tbtn" id="bTd">추력▼</button>
    <button class="tbtn" id="bV">시점</button>
  </div>
  <button id="pauseBtn" aria-label="일시정지">II</button>
  <button id="fsHud" class="fsBtn" aria-label="전체화면">⛶</button>
  <button id="helpHud" aria-label="조종법 보기">?</button>

  <section class="screen on" id="title">
    <div class="wrap">
      <h1><small>6·25 전쟁 대한민국 공군</small>하늘의 작전</h1>
      <p>F-51 무스탕 조종석에 앉아 1952~1953년 한국 공군이 해낸 두 작전을 직접 날아 봐요. 끊기지 않던 철교, 그리고 351고지의 하늘.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="goSelect">작전 고르기</button><button class="btn ghost fsBtn">전체화면</button></div>
    </div>
  </section>

  <section class="screen" id="select">
    <h2>출격할 작전을 고르세요</h2>
    <div class="missions">
      <button class="mcard" data-m="bridge"><span class="done">완료</span>
        <svg viewBox="0 0 300 90" aria-hidden="true"><rect width="300" height="90" fill="#cfd8dd"/><path d="M0 52 Q80 38 150 50 T300 46 L300 70 Q220 62 150 72 T0 74Z" fill="#8fa9b8"/>
        <g fill="#3c3b38"><rect x="95" y="52" width="110" height="5"/><rect x="100" y="57" width="4" height="18"/><rect x="127" y="57" width="4" height="18"/><rect x="154" y="57" width="4" height="18"/><rect x="181" y="57" width="4" height="18"/></g>
        <rect x="122" y="44" width="56" height="20" fill="none" stroke="#C8372D" stroke-width="2.5" stroke-dasharray="6 4"/></svg>
        <h3>승호리 철교 차단작전</h3><span class="d">1952년 1월 15일 · 평양 동쪽</span>
        <p>유엔 공군이 500번 넘게 실패한 철교. 급강하해서 가운데 경간 2개를 끊어요.</p></button>
      <button class="mcard" data-m="hill"><span class="done">완료</span>
        <svg viewBox="0 0 300 90" aria-hidden="true"><rect width="300" height="90" fill="#cdd3cf"/><path d="M0 90 L60 70 Q120 30 150 22 Q185 30 240 68 L300 80 L300 90Z" fill="#7d7356"/>
        <rect x="140" y="20" width="10" height="4" fill="#ff7a1a"/><rect x="156" y="24" width="10" height="4" fill="#ff7a1a"/>
        <circle cx="100" cy="52" r="9" fill="#fff" opacity=".85"/><circle cx="104" cy="42" r="7" fill="#fff" opacity=".7"/><circle cx="108" cy="33" r="5" fill="#fff" opacity=".5"/></svg>
        <h3>351고지 근접항공지원</h3><span class="d">1953년 3월 · 동해안 전선</span>
        <p>정찰기가 연막으로 표시한 적 진지를 로켓과 기총으로 공격해 고지를 지키는 국군을 도와요.</p></button>
    </div>
    <button class="btn ghost" id="backTitle">처음으로</button>
  </section>

  <section class="screen" id="brief">
    <div class="order"><div class="stamp">극비</div><div id="briefBody"></div>
      <div class="row"><div class="dots" id="dots"></div><div style="display:flex;gap:10px"><button class="btn ghost" id="prevBtn">이전</button><button class="btn" id="nextBtn">다음</button></div></div></div>
  </section>

  <section class="screen" id="pause">
    <div class="order"><h2>일시정지</h2><p class="date">조종 설정</p>
      <div class="toggle"><span>쉬운 조종 (손을 떼면 날개 수평, 목표 신호·조준 보정)</span><button id="tEasy" aria-pressed="true">켜짐</button></div>
      <div class="toggle"><span>자동 수평 보조 (손을 떼면 날개가 수평으로)</span><button id="tAssist" aria-pressed="true">켜짐</button></div>
      <div class="toggle"><span>실제 조종간 방식 (↓ 당기면 상승, ↑ 밀면 하강)</span><button id="tInvert" aria-pressed="true">켜짐</button></div>
      <div class="toggle"><span>소리</span><button id="tSound" aria-pressed="true">켜짐</button></div>
      <div class="toggle"><span>조종법 다시 보기</span><button id="pHelp">보기</button></div>
      <div class="toggle"><span>전체화면</span><button class="fsBtn" aria-pressed="false">켜기</button></div>
      <div class="row"><button class="btn ghost" id="pQuit">작전 고르기</button><div style="display:flex;gap:10px"><button class="btn ghost" id="pRestart">다시 시작</button><button class="btn" id="pResume">계속</button></div></div></div>
  </section>

  <section class="screen" id="help"><div class="order"><div id="helpBody"></div><div class="row"><span class="note" style="font-size:14px">H 키로도 열 수 있어요</span><button class="btn" id="helpClose">계속 비행하기</button></div></div></section>
  <section class="screen" id="debrief"><div class="order" id="debriefBody"></div></section>
  <section class="screen" id="quiz"><div class="order" id="quizBody"></div></section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
if(!window.THREE){$('loading').textContent='3D 엔진을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';return;}
const T=THREE;
const V=(x,y,z)=>new T.Vector3(x,y,z);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const AX=V(1,0,0),AY=V(0,1,0),AZ=V(0,0,1);
const FT=3.281,KT=1.944;

/* ---------- noise ---------- */
function hash(i,j){let h=Math.imul(i|0,374761393)^Math.imul(j|0,668265263);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o){o=o||5;let s=0,a=1,f=1,n=0;for(let i=0;i<o;i++){s+=a*vn(x*f+i*17.3,y*f-i*9.1);n+=a;a*=.5;f*=2.03;}return s/n;}
function ridge(x,y){let s=0,a=1,f=1,n=0;for(let i=0;i<4;i++){s+=a*(1-Math.abs(2*vn(x*f+31,y*f+7)-1));n+=a;a*=.5;f*=2.1;}return s/n;}

/* ---------- height functions ---------- */
const DECK=68;
const riverZ=x=>Math.sin(x/900)*180+Math.sin(x/370+1)*60-Math.sin(1)*60;
function hBridge(x,z){const d=Math.hypot(x,z);
  let h=(fbm(x/2400+3,z/2400+7)*.55+ridge(x/1500,z/1500)*.6)*980-300;
  h=lerp(62+fbm(x/520,z/520,3)*34,h,smooth(700,3300,d));
  const rz=Math.abs(z-riverZ(x));h=lerp(8,h,smooth(95,240,rz));
  const c=(1-smooth(14,70,Math.abs(x)))*(1-smooth(500,900,Math.abs(z)))*smooth(112,175,rz);
  return lerp(h,DECK+.5,c);}
const coastX=z=>3200+Math.sin(z/1300)*420+Math.sin(z/430)*90;
function hHill(x,z){const d=Math.hypot(x,z);
  let h=(fbm(x/2300+11,z/2300+2)*.55+ridge(x/1400+5,z/1400)*.6)*900-260;
  h=lerp(95+fbm(x/600,z/600,3)*45,h,smooth(650,2800,d));
  const g=Math.exp(-(d*d)/(2*390*390));h=lerp(h,351+fbm(x/90,z/90,3)*10-5,g);
  h+=fbm(x/140,z/140,3)*22*g;
  const s=smooth(coastX(z)-700,coastX(z)+250,x);return lerp(h,-45,s);}

function canvasTex(sz,fn){const c=document.createElement('canvas');c.width=c.height=sz;fn(c.getContext('2d'),sz);const t=new T.CanvasTexture(c);return t;}
const texSoft=canvasTex(64,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.45,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s);});
const texPuff=canvasTex(128,(g,s)=>{for(let i=0;i<14;i++){const x=s/2+rnd(-28,28),y=s/2+rnd(-28,28),rr=rnd(18,36);const r=g.createRadialGradient(x,y,0,x,y,rr);
  r.addColorStop(0,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s);}});
const texCloud=canvasTex(256,(g,s)=>{for(let i=0;i<26;i++){const x=s/2+rnd(-80,80),y=s/2+rnd(-34,30),rr=rnd(30,70);const r=g.createRadialGradient(x,y,0,x,y,rr);
  r.addColorStop(0,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s);}});
function roundelTex(kind){return canvasTex(128,(g,s)=>{const c=s/2;
  if(kind==='usaf'){g.fillStyle='#fff';g.beginPath();g.arc(c,c,60,0,7);g.fill();g.fillStyle='#1d3f86';g.beginPath();g.arc(c,c,54,0,7);g.fill();
    g.fillStyle='#fff';g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?20:50;g.lineTo(c+Math.cos(a)*r,c+Math.sin(a)*r);}g.fill();return;}
  const Rr=50;g.fillStyle='#fff';g.beginPath();g.arc(c,c,60,0,7);g.fill();
  g.fillStyle='#1f4fa0';g.beginPath();g.arc(c,c,Rr,0,7);g.fill();
  g.fillStyle='#c8372d';g.beginPath();g.arc(c,c,Rr,Math.PI,0);g.fill();
  g.beginPath();g.arc(c-Rr/2,c,Rr/2,0,7);g.fill();
  g.fillStyle='#1f4fa0';g.beginPath();g.arc(c+Rr/2,c,Rr/2,0,7);g.fill();});}
const TEX_ROK=roundelTex('rok'),TEX_US=roundelTex('usaf');

function makePlane(o){o=o||{};const g=new T.Group();
  const metal=new T.MeshPhongMaterial({color:o.color||0xb2b7bb,specular:0x9a9a9a,shininess:70,side:T.DoubleSide});
  const dark=new T.MeshPhongMaterial({color:0x262626,shininess:20});
  const accent=new T.MeshPhongMaterial({color:o.accent||0x2a2a2a,shininess:40});
  const prof=[[.02,-5.35],[.2,-5.0],[.38,-4.0],[.55,-2.5],[.68,-1.0],[.74,.3],[.74,1.6],[.7,2.8],[.6,3.7],[.46,4.2],[.36,4.42]].map(p=>new T.Vector2(p[0],p[1]));
  const fg=new T.LatheGeometry(prof,18);fg.rotateX(-Math.PI/2);fg.scale(1,1.12,1);g.add(new T.Mesh(fg,metal));
  const sp=new T.ConeGeometry(.36,.95,16);sp.rotateX(-Math.PI/2);const spin=new T.Mesh(sp,accent);spin.position.z=-4.88;g.add(spin);
  const prop=new T.Group();prop.position.z=-4.55;const bg=new T.BoxGeometry(.24,1.75,.06);bg.translate(0,.875,0);
  for(let i=0;i<4;i++){const b=new T.Mesh(bg,dark);b.rotation.z=i*Math.PI/2;prop.add(b);}
  g.add(prop);
  const disc=new T.Mesh(new T.CircleGeometry(1.78,32),new T.MeshBasicMaterial({color:0x222222,transparent:true,opacity:.14,side:T.DoubleSide,depthWrite:false}));disc.position.z=-4.57;g.add(disc);
  const ex={depth:.2,bevelEnabled:false};
  function half(pts,y,dih,decal){const s=new T.Shape();pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));
    const geo=new T.ExtrudeGeometry(s,ex);geo.rotateX(Math.PI/2);const m=new T.Mesh(geo,metal);m.position.y=y;m.rotation.z=dih;
    if(decal){const d=new T.Mesh(new T.PlaneGeometry(1.15,1.15),new T.MeshLambertMaterial({map:o.roundel==='usaf'?TEX_US:TEX_ROK,transparent:true,polygonOffset:true,polygonOffsetFactor:-2}));
      d.rotation.x=-Math.PI/2;d.position.set(decal,.012,.45);m.add(d);}
    g.add(m);return m;}
  half([[0,-1.05],[5.6,-.15],[5.6,.95],[0,1.55]],-.28,.075,4.1);
  half([[0,-1.05],[-5.6,-.15],[-5.6,.95],[0,1.55]],-.28,-.075,-4.1);
  ex.depth=.1;half([[0,3.9],[2.05,4.45],[2.05,5.0],[0,5.3]],.2,0);half([[0,3.9],[-2.05,4.45],[-2.05,5.0],[0,5.3]],.2,0);
  const fs=new T.Shape();[[-3.6,.5],[-5.35,.5],[-5.42,2.15],[-5.0,2.25],[-4.4,1.4],[-3.6,.78]].forEach((p,i)=>i?fs.lineTo(p[0],p[1]):fs.moveTo(p[0],p[1]));
  const fgeo=new T.ExtrudeGeometry(fs,{depth:.12,bevelEnabled:false});fgeo.rotateY(Math.PI/2);const fin=new T.Mesh(fgeo,metal);fin.position.x=-.06;g.add(fin);
  if(o.tail){const tm=new T.Mesh(new T.BoxGeometry(.14,.5,1.2),new T.MeshPhongMaterial({color:o.tail}));tm.position.set(0,1.95,5.0);g.add(tm);}
  const can=new T.Mesh(new T.SphereGeometry(1,18,12),new T.MeshPhongMaterial({color:0x6f8fa3,specular:0xffffff,shininess:120,transparent:true,opacity:.75}));
  can.scale.set(.46,.5,1.35);can.position.set(0,.66,.1);g.add(can);
  const sc=new T.Mesh(new T.BoxGeometry(.75,.48,2.6),metal);sc.position.set(0,-.8,1.15);g.add(sc);
  [-1,1].forEach(s=>{const e=new T.Mesh(new T.BoxGeometry(.12,.24,1.2),dark);e.position.set(s*.63,.25,-2.9);g.add(e);
    const d=new T.Mesh(new T.PlaneGeometry(.9,.9),new T.MeshLambertMaterial({map:o.roundel==='usaf'?TEX_US:TEX_ROK,transparent:true,polygonOffset:true,polygonOffsetFactor:-2}));
    d.position.set(s*.75,.05,2.3);d.rotation.y=s*Math.PI/2;g.add(d);});
  const stores=[];
  if(o.load==='bombs'){const bm=new T.MeshPhongMaterial({color:0x3f4637});[-1,1].forEach(s=>{const b=makeBombMesh(bm);b.position.set(s*2.2,-.78,-.3);g.add(b);stores.push(b);});}
  if(o.load==='rockets'){const rm=new T.MeshPhongMaterial({color:0x5a5f52});[-1,1].forEach(s=>[2.7,3.3,3.9].forEach(x=>{const r=makeRocketMesh(rm);r.position.set(s*x,-.55,-.2+x*.06);g.add(r);stores.push(r);}));}
  g.userData={prop,disc,stores};return g;}
function makeBombMesh(m){const b=new T.Group();const c=new T.Mesh(new T.CylinderGeometry(.2,.2,1.2,10),m);c.rotation.x=Math.PI/2;b.add(c);
  const n=new T.Mesh(new T.SphereGeometry(.2,10,8),m);n.position.z=-.6;b.add(n);const t=new T.Mesh(new T.ConeGeometry(.2,.5,10),m);t.rotation.x=Math.PI/2;t.position.z=.85;b.add(t);return b;}

/* ---------- particles ---------- */
const parts=[],pool={n:[],a:[]};
function puff(tex,pos,vel,life,s0,s1,op,color,add,rise){const k=add?'a':'n';let sp=pool[k].pop();
  if(!sp){sp=new T.Sprite(new T.SpriteMaterial({map:tex,transparent:true,depthWrite:false,blending:add?T.AdditiveBlending:T.NormalBlending}));}
  sp.material.map=tex;sp.material.color.set(color||0xffffff);sp.material.opacity=op;sp.material.rotation=rnd(0,6.28);
  sp.position.copy(pos);sp.scale.setScalar(s0);scene.add(sp);
  parts.push({sp,vel:vel||V(0,0,0),life,t:0,s0,s1,op,k,rise:rise||0});}
function updParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;const f=p.t/p.life;
  if(f>=1){scene.remove(p.sp);pool[p.k].push(p.sp);parts.splice(i,1);continue;}
  p.sp.position.addScaledVector(p.vel,dt);p.sp.position.y+=p.rise*dt;p.sp.scale.setScalar(lerp(p.s0,p.s1,1-Math.pow(1-f,2)));
  p.sp.material.opacity=p.op*(f<.1?f/.1:1-(f-.1)/.9);}}
function clearParts(){parts.forEach(p=>{scene.remove(p.sp);pool[p.k].push(p.sp);});parts.length=0;}
function explosion(pos,size,dark){size=size||1;for(let i=0;i<7;i++)puff(texSoft,pos.clone().add(V(rnd(-4,4),rnd(0,5),rnd(-4,4)).multiplyScalar(size)),V(rnd(-6,6),rnd(4,16),rnd(-6,6)).multiplyScalar(size),rnd(.4,.8),6*size,22*size,1,0xffa040,true);
  for(let i=0;i<10;i++)puff(texPuff,pos.clone().add(V(rnd(-6,6),rnd(0,6),rnd(-6,6)).multiplyScalar(size)),V(rnd(-5,5),rnd(6,18),rnd(-5,5)).multiplyScalar(size),rnd(2.5,4.5),8*size,40*size,.85,dark?0x3a3836:0x6a655e,false,3);
  if(!dark)for(let i=0;i<6;i++)puff(texSoft,pos.clone(),V(rnd(-1,1),rnd(.6,1.4),rnd(-1,1)).normalize().multiplyScalar(rnd(25,45)*size),rnd(.6,1),2*size,3*size,1,0x8a7a62,false);}
function flakBurst(pos){puff(texSoft,pos,null,.18,6,14,1,0xffb060,true);for(let i=0;i<5;i++)puff(texPuff,pos.clone().add(V(rnd(-4,4),rnd(-3,3),rnd(-4,4))),V(rnd(-2,2),rnd(-1,1),rnd(-2,2)),rnd(3,4.5),10,26,.9,0x2a2a2c,false);}

const sun=new T.DirectionalLight(0xfff0dc,.95);sun.position.set(-3000,4200,2500);scene.add(sun);
const hemi=new T.HemisphereLight(0xcfe0ee,0x6b6255,.62);scene.add(hemi);
const skyMat=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{top:{value:new T.Color(0x4d7cab)},bot:{value:new T.Color(0xd4e0e8)}},

let world=null,WD=null;
const Cc=h=>new T.Color(h);
const cSnow=Cc(0xeef2f5),cSnowS=Cc(0xd2dbe2),cRock=Cc(0x7c8186),cBank=Cc(0xa79f90),cDirt=Cc(0x958a77);
const cGrass=Cc(0x7c7556),cOlive=Cc(0x646e49),cBrown=Cc(0x6f5c46),cSand=Cc(0xc8bd98),cRockS=Cc(0x8a8478);
function colorAt(x,y,z,ny,out){const n=fbm(x/160,z/160,3),n2=vn(x/40,z/40);
  if(WD.winter){out.copy(cSnow).lerp(cSnowS,n);out.lerp(cRock,(1-smooth(.62,.9,ny))*.85);
    if(y<WD.water+9)out.lerp(cBank,.7);if(n>.6)out.lerp(cDirt,Math.min(1,(n-.6)*1.3));}
  else{out.copy(cGrass).lerp(cOlive,n);if(n2>.6)out.lerp(cBrown,.35);out.lerp(cRockS,(1-smooth(.6,.88,ny))*.8);
    if(y>470)out.lerp(cSnow,smooth(470,620,y+n*90));out.lerp(cBrown,(1-smooth(150,540,Math.hypot(x,z)))*.55);if(y<5)out.copy(cSand);}
  return out.multiplyScalar(.9+n2*.14);}

function buildWorld(key){
  if(world){scene.remove(world);world.traverse(o=>{if(o.geometry&&!o.userData.keepGeo)o.geometry.dispose();});}
  clearParts();bullets.length=0;projs.length=0;
  world=new T.Group();scene.add(world);
  const winter=key==='bridge';
  WD={key,winter,hf:winter?hBridge:hHill,water:winter?24:0};
  skyMat.uniforms.top.value.set(winter?0x4a79a8:0x7d97ab);skyMat.uniforms.bot.value.set(winter?0xd6e1e9:0xd5d8d2);
  scene.fog=new T.Fog(winter?0xd6e1e9:0xd5d8d2,1600,winter?11500:8500);
  hemi.color.set(winter?0xd8e6f2:0xd9dccf);hemi.groundColor.set(winter?0x7b7a74:0x5e5444);sun.intensity=winter?.95:.85;
  const size=19000,seg=240,geo=new T.PlaneGeometry(size,size,seg,seg);geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;for(let i=0;i<pos.count;i++)pos.setY(i,WD.hf(pos.getX(i),pos.getZ(i)));
  geo.computeVertexNormals();const nr=geo.attributes.normal,cols=new Float32Array(pos.count*3),tc=new T.Color();
  for(let i=0;i<pos.count;i++){colorAt(pos.getX(i),pos.getY(i),pos.getZ(i),nr.getY(i),tc);cols[i*3]=tc.r;cols[i*3+1]=tc.g;cols[i*3+2]=tc.b;}
  geo.setAttribute('color',new T.BufferAttribute(cols,3));
  world.add(new T.Mesh(geo,new T.MeshLambertMaterial({vertexColors:true})));
  const wm=new T.Mesh(new T.PlaneGeometry(size,size),new T.MeshPhongMaterial({color:winter?0x9fb5c2:0x48697e,specular:0x556677,shininess:70}));
  wm.rotation.x=-Math.PI/2;wm.position.y=WD.water;world.add(wm);
  if(winter){const im=new T.MeshLambertMaterial({color:0xe6eef3});for(let i=0;i<60;i++){const x=rnd(-2500,2500),z=riverZ(x)+rnd(-70,70);
    if(Math.abs(x)<40)continue;const m=new T.Mesh(new T.CircleGeometry(rnd(6,22),7),im);m.rotation.x=-Math.PI/2;m.position.set(x,WD.water+.3,z);world.add(m);}}
  // trees
  const N=winter?2600:2300,tg=new T.ConeGeometry(4.5,15,6);tg.translate(0,7,0);
  const tmesh=new T.InstancedMesh(tg,new T.MeshLambertMaterial({color:winter?0x4d6455:0x34493a}),N),dm=new T.Object3D();let c=0,tries=0;
  while(c<N&&tries<N*10){tries++;const x=rnd(-7500,7500),z=rnd(-7500,7800);if(fbm(x/700,z/700,3)<.52)continue;
    const y=WD.hf(x,z);if(y<WD.water+8)continue;const sl=(Math.abs(WD.hf(x+8,z)-y)+Math.abs(WD.hf(x,z+8)-y))/8;if(sl>.9)continue;
    if(winter){if(Math.abs(x)<90&&Math.abs(z)<1400)continue;}else{if(Math.hypot(x,z)<560||x>coastX(z)-750)continue;}
    dm.position.set(x,y-1,z);const s=rnd(.7,1.5);dm.scale.set(s,s*rnd(.9,1.3),s);dm.rotation.y=rnd(0,6);dm.updateMatrix();tmesh.setMatrixAt(c++,dm.matrix);}
  tmesh.count=c;world.add(tmesh);
  // clouds
  const cm=new T.SpriteMaterial({map:texCloud,transparent:true,depthWrite:false,opacity:winter?.55:.68});
  for(let i=0;i<(winter?38:70);i++){const s=new T.Sprite(cm);s.position.set(rnd(-9000,9000),rnd(1650,2600),rnd(-9000,9000));s.scale.set(rnd(900,1900),rnd(330,620),1);world.add(s);}
  // villages
  const wall=new T.MeshLambertMaterial({color:winter?0xc9c4b8:0xb8ad98}),roof=new T.MeshLambertMaterial({color:winter?0xe8edf0:0x7d6a4f});
  const villages=winter?[[-900,600],[1300,-700],[-1600,-900],[700,1500],[2100,500]]:[[-1400,1600],[900,2300],[-2200,-600],[1700,1200]];
  villages.forEach(([vx,vz])=>{for(let i=0;i<9;i++){const x=vx+rnd(-90,90),z=vz+rnd(-90,90),y=WD.hf(x,z);if(y<WD.water+4)continue;
    const h=new T.Mesh(new T.BoxGeometry(8,3.5,5.5),wall);h.position.set(x,y+1.6,z);h.rotation.y=rnd(0,3);world.add(h);
    const r=new T.Mesh(new T.ConeGeometry(6.4,3,4),roof);r.position.set(x,y+4.6,z);r.rotation.y=h.rotation.y+Math.PI/4;r.scale.set(1,1,.75);world.add(r);}});
  if(winter)buildBridgeObjs();else buildHillObjs();
}

const steel=new T.MeshPhongMaterial({color:0x3b3a36,shininess:30}),conc=new T.MeshLambertMaterial({color:0x8d887e}),ballast=new T.MeshLambertMaterial({color:0x6e665c});
const sandM=new T.MeshLambertMaterial({color:0x7b6a4c}),logM=new T.MeshLambertMaterial({color:0x4b3d2e}),gunM=new T.MeshPhongMaterial({color:0x2b2d2a});
function aaSite(x,z){const y=WD.hf(x,z),g=new T.Group();g.position.set(x,y,z);
  const ring=new T.Mesh(new T.TorusGeometry(4,1.1,6,12),sandM);ring.rotation.x=Math.PI/2;ring.position.y=.6;g.add(ring);
  [-.5,.5].forEach(s=>{const b=new T.Mesh(new T.CylinderGeometry(.18,.18,5,6),gunM);b.position.set(s,2.6,0);b.rotation.x=.7;g.add(b);});
  world.add(g);return{g,pos:V(x,y+2,z),active:true,cd:rnd(0,2),hp:60};}
function buildBridgeObjs(){WD.spans=[];
  for(let i=0;i<4;i++){const s=new T.Group(),zc=-110+55*i+27.5;s.position.set(0,DECK,zc);
    const add=(gw,gh,gd,x,y,z,rx)=>{const m=new T.Mesh(new T.BoxGeometry(gw,gh,gd),steel);m.position.set(x,y,z);if(rx)m.rotation.x=rx;s.add(m);};
    add(7,1.2,55,0,0,0);
    for(const sd of [-1,1]){add(.45,.45,55,sd*3.5,6.6,0);add(.45,.45,55,sd*3.5,.6,0);
      for(let k=0;k<=5;k++)add(.32,6,.32,sd*3.5,3.6,-27.5+k*11);
      for(let k=0;k<5;k++)add(.25,.25,12.5,sd*3.5,3.6,-27.5+k*11+5.5,(k%2?1:-1)*Math.atan2(6,11));}
    for(let k=0;k<=5;k++)add(7.2,.25,.25,0,6.6,-27.5+k*11);
    [-.75,.75].forEach(x=>{const r=new T.Mesh(new T.BoxGeometry(.16,.25,55),ballast);r.position.set(x,.72,0);s.add(r);});
    world.add(s);WD.spans.push({g:s,zc,alive:true,fall:0,rot:rnd(-.5,.5)});}
  for(let k=0;k<=4;k++){const z=-110+55*k,end=k===0||k===4,m=new T.Mesh(new T.BoxGeometry(end?9:5.5,DECK,end?10:6),conc);m.position.set(0,DECK/2-.6,z);world.add(m);}
  for(const dir of [-1,1])for(let z=125;z<3400;z+=30){const zz=dir*z,y1=hBridge(0,zz-15),y2=hBridge(0,zz+15);

function noiseBuf(len){const b=AC.createBuffer(1,Math.floor(AC.sampleRate*len),AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}

  engO=AC.createOscillator();engO.type='sawtooth';engO2=AC.createOscillator();engO2.type='square';
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;engG=AC.createGain();engG.gain.value=0;
  const g2=AC.createGain();g2.gain.value=.35;engO.connect(f);engO2.connect(g2);g2.connect(f);f.connect(engG);engG.connect(AC.destination);engO.start();engO2.start();
  const ns=AC.createBufferSource();ns.buffer=noiseBuf(2);ns.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=.6;
  windG=AC.createGain();windG.gain.value=0;ns.connect(bp);bp.connect(windG);windG.connect(AC.destination);ns.start();}catch(e){AC=null;}}

  if(!on||muted){engG.gain.setTargetAtTime(0,t,.2);windG.gain.setTargetAtTime(0,t,.2);return;}

  const s=AC.createBufferSource();s.buffer=noiseBuf(cfg[0]);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=cfg[1];

function flight(dt){const k=G.keys;let p=0,r=0;
  if(k.KeyW||k.ArrowUp)p+=1;if(k.KeyS||k.ArrowDown)p-=1;if(k.KeyA||k.ArrowLeft)r-=1;if(k.KeyD||k.ArrowRight)r+=1;
  p+=-Math.sign(stick.y)*Math.pow(Math.abs(stick.y),1.4);r+=Math.sign(stick.x)*Math.pow(Math.abs(stick.x),1.4);
  p=clamp(p,-1,1);r=clamp(r,-1,1);if(G.invert)p=-p;
  if(k.KeyE||k.Equal||k.NumpadAdd||k.ShiftLeft)PL.thr=Math.min(1,PL.thr+.45*dt);if(k.KeyQ||k.Minus||k.NumpadSubtract)PL.thr=Math.max(.2,PL.thr-.45*dt);
  G.inp.pitch=lerp(G.inp.pitch,p,1-Math.exp(-dt*8));G.inp.roll=lerp(G.inp.roll,r,1-Math.exp(-dt*8));
  if(G.easy){easyFly(dt);}else{
  const auth=clamp((PL.v-40)/70,.3,1.15);
  qT.setFromAxisAngle(AX,G.inp.pitch*1.05*auth*dt);PL.q.multiply(qT);
  qT.setFromAxisAngle(AZ,-G.inp.roll*2.1*auth*dt);PL.q.multiply(qT);
  const up=upOf(PL.q),right=rightOf(PL.q),bank=Math.atan2(-right.y,up.y);
  if(G.assist&&Math.abs(G.inp.roll)<.05){qT.setFromAxisAngle(AZ,clamp(bank,-1,1)*1.3*dt);PL.q.multiply(qT);}
  qT.setFromAxisAngle(AY,-Math.sin(bank)*.62*clamp(up.y+.2,0,1)*dt);PL.q.premultiply(qT);
  if(PL.v<52){qT.setFromAxisAngle(AX,-(52-PL.v)*.025*dt);PL.q.multiply(qT);}
  PL.q.normalize();const fwd=fwdOf(PL.q);
  PL.v+=(PL.thr*27-.00108*PL.v*PL.v-9.8*fwd.y)*dt;PL.v=clamp(PL.v,38,235);
  PL.pos.addScaledVector(fwd,PL.v*dt);if(PL.v<60)PL.pos.y-=(60-PL.v)*.18*dt;}
  PL.mesh.position.copy(PL.pos);PL.mesh.quaternion.copy(PL.q);
  const gy=WD.hf(PL.pos.x,PL.pos.z);
  if(PL.pos.y<Math.max(gy,WD.water)+1.6)return crash();
  if(WD.key==='bridge'&&Math.abs(PL.pos.x)<6&&Math.abs(PL.pos.z)<112&&PL.pos.y<DECK+8&&PL.pos.y>DECK-2){const s=WD.spans[Math.min(3,Math.floor((PL.pos.z+110)/55))];if(s&&s.alive)return crash();}}

  EZ.pit=clamp(EZ.pit+G.inp.pitch*.8*dt,-1.15,.75);EZ.bank+=clamp((tb-EZ.bank)*3,-1.6,1.6)*dt;EZ.yaw-=Math.sin(EZ.bank)*.7*dt;

  PL.v=lerp(PL.v,clamp(100+PL.thr*28-EZ.pit*70,70,200),1-Math.exp(-dt*.9));PL.pos.addScaledVector(fwdOf(PL.q),PL.v*dt);}

  if(G.mkey==='hill'&&want&&PL.gun>0&&G.gunCool<=0&&G.mode==='play'){G.gunCool=1/16;G.gunSide*=-1;PL.gun-=2;
    const fwd=fwdOf(PL.q),conv=PL.pos.clone().addScaledVector(fwd,380),from=PL.pos.clone().add(V(G.gunSide*3.1,-.4,-1.2).applyQuaternion(PL.q));

function drawMini(){const c=$('mini').getContext('2d'),S=240,R0=112,range=G.mkey==='bridge'?4200:2600,sc=R0/range,h=hdg()*Math.PI/180;

  const pt=(x,z)=>{let dx=(x-PL.pos.x)*sc,dy=(z-PL.pos.z)*sc;const cs=Math.cos(-h),sn=Math.sin(-h);let mx=dx*cs-dy*sn,my=dx*sn+dy*cs;const m=Math.hypot(mx,my);if(m>R0-6){mx*=(R0-6)/m;my*=(R0-6)/m;}return[mx,my];};
  const dot=(x,z,r,col)=>{const[a,b]=pt(x,z);c.fillStyle=col;c.beginPath();c.arc(a,b,r,0,7);c.fill();};
  const n=pt(PL.pos.x,PL.pos.z-range*.85);c.fillStyle='#e9eef1';c.font='bold 18px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('N',n[0],n[1]);
  if(G.mkey==='bridge'){if(Math.hypot(PL.pos.x,PL.pos.z)>range*.9)dot(0,0,6,'#ff6a5a');const a=pt(0,-110),b=pt(0,110);c.strokeStyle='#ff6a5a';c.lineWidth=5;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();}
  else{WD.friends.forEach(f=>dot(f.x,f.z,4,'#ff9a3a'));WD.targets.forEach((t,i)=>{if(t.alive)dot(t.pos.x,t.pos.z,i===MI.cur?7:5,i===MI.cur?'#ffffff':'#ff6a5a');});dot(WD.mos.position.x,WD.mos.position.z,4,'#ffd27a');}
  c.fillStyle='#ffc04a';c.beginPath();c.moveTo(0,-12);c.lineTo(8,9);c.lineTo(0,5);c.lineTo(-8,9);c.closePath();c.fill();c.restore();}
function updRing(){ring.visible=false;G.ringGo=false;beacon.visible=false;

    else if(MI.cur>=0&&WD.targets[MI.cur].alive){const t=WD.targets[MI.cur];beacon.visible=true;beacon.position.set(t.pos.x,t.pos.y+450,t.pos.z);beacon.material.color.set(0xffffff);}

  if(G.mkey==='bridge'){if(Math.hypot(PL.pos.x,PL.pos.z)>3200)return;const p=PL.pos.clone().add(V(0,-1.3,0)),pr=predict(p,fwd.clone().multiplyScalar(PL.v),1);if(!pr)return;
    const sg=clamp((p.y-pr.p.y)*.028,3,60)*(G.easy?.45:1);ring.position.copy(pr.p);ring.position.y+=1;ring.scale.setScalar(sg*2);ring.visible=true;
    const k=Math.floor((pr.p.z+110)/55);go=Math.abs(pr.p.x)<(G.easy?20:6)&&Math.abs(pr.p.z)<(G.easy?70:48)&&(G.easy?(WD.spans[1].alive||WD.spans[2].alive):WD.spans[pr.p.z<0?1:2].alive);}
  else{if(fwd.y>-.05)return;const pr=predict(PL.pos.clone(),fwd.clone().multiplyScalar(PL.v+300),.35);if(!pr||pr.t>6)return;ring.position.copy(pr.p);ring.position.y+=1;ring.scale.setScalar(14);ring.visible=true;
    if(MI.cur>=0){const t=WD.targets[MI.cur];go=t.alive&&Math.hypot(pr.p.x-t.pos.x,pr.p.z-t.pos.z)<(G.easy?30:16);}}

<div class="a">아군</div><div>산꼭대기 <b style="color:#d4600f">주황색 천</b>은 우리 편이에요. 쏘면 안 돼요.</div></div>
<p>적 진지 <mark>3곳</mark>을 부수면 성공이에요.</p><ul>${CTRL}</ul>`]};
let bk='bridge',bp=0;
function renderBrief(){const P=BRIEF[bk];$('briefBody').innerHTML=P[bp];$('dots').innerHTML=P.map((_,i)=>`<i class="${i===bp?'on':''}"></i>`).join('');
  $('prevBtn').style.visibility=bp?'visible':'hidden';$('nextBtn').textContent=bp===P.length-1?'출격':'다음';$('brief').scrollTop=0;}
$('goSelect').onclick=()=>{audioInit();toSelect();};
$('backTitle').onclick=()=>{G.mode='title';showScreen('title');};
document.querySelectorAll('.mcard').forEach(m=>m.onclick=()=>{audioInit();bk=m.dataset.m;bp=0;renderBrief();G.mode='brief';showScreen('brief');});
$('prevBtn').onclick=()=>{if(bp>0){bp--;renderBrief();}};
$('nextBtn').onclick=()=>{if(bp<BRIEF[bk].length-1){bp++;renderBrief();}else startMission(bk);};

function debrief(){G.mode='debrief';$('hud').classList.remove('on');$('pauseBtn').style.display='none';$('fsHud').style.display='none';$('helpHud').style.display='none';engineSet(false);const r=G.result,win=r==='win';if(win)markCleared(G.mkey);
  const head={win:'임무 성공',crash:'지면 충돌',shot:'기체 손상, 비상 탈출',ammo:'무장 소진, 귀환',lost:'방어선 후퇴'}[r];let html='';
  if(G.mkey==='bridge'){const avg=MI.rel.length?Math.round(MI.rel.reduce((a,b)=>a+b,0)/MI.rel.length):0;
    const lead=win?'가운데 경간 2개를 끊었어요. 1952년 1월 15일, 실제 조종사들도 같은 결과를 냈어요.':r==='crash'?'너무 낮게 내려가 땅에 부딪혔어요. 실제 조종사들은 낮게 내려가면서도 제때 기수를 올렸어요.':r==='shot'?'대공포에 기체가 크게 상했어요. 실제 조종사들도 이 위험을 무릅쓰고 내려갔어요.':'다리를 끊지 못했어요. 1월 12일의 첫 출격도 이렇게 실패했어요. 더 낮게 내려가 보세요.';
    html=`<div class="stamp">${win?'완료':'재출격'}</div><h2>${head}</h2><p class="date">승호리 철교 작전 결과</p><p>${lead}</p>
    <div class="stat"><div><small>가운데 경간</small><b>${MI.hits} / 2</b></div><div><small>평균 투하 높이</small><b>${avg?avg.toLocaleString('ko-KR')+'ft':'-'}</b></div><div><small>기체 상태</small><b>${Math.round(PL.hp)}%</b></div></div>
    <p>실제 작전에서 조종사들은 약 <mark>4,000피트에서 급강하해 1,500피트</mark>까지 내려가 폭탄을 떨어뜨렸어요. 2개 편대 6대가 출격해 철교 가운데 경간 2개를 끊었고, 한국 공군이 스스로 작전을 해낼 수 있다는 것을 보여 주었어요.</p>
    <p style="margin-bottom:4px"><b>1952년 1월 15일 출격 조종사</b></p>
    <div class="crew"><span>1편대장 옥만호 대위</span><span>2편대장 윤응렬 대위</span><span>2번기 유치곤 대위</span><span>2번기 정주량 대위</span><span>3번기 박재호 대위</span><span>3번기 장성태 대위</span></div>
    <p>유치곤 장군은 전쟁 동안 203회 출격했고, 영화 「빨간 마후라」의 실제 주인공이기도 해요.</p>`;}
  else{const lead=win?'흰 연막이 가리킨 적 진지를 모두 부수고 351고지를 지켜 냈어요.':r==='lost'?'적 진지를 제때 부수지 못해 방어선이 밀렸어요. 연막 표시를 빨리 찾아가 보세요.':r==='crash'?'고지 근처에서 땅에 부딪혔어요. 공격 뒤에는 바로 기수를 올려야 해요.':'기체가 크게 상했어요. 대공포 진지가 제압될 때까지 높이 머무는 것도 방법이에요.';
    html=`<div class="stamp">${win?'완료':'재출격'}</div><h2>${head}</h2><p class="date">351고지 작전 결과</p><p>${lead}</p>
    <div class="stat"><div><small>부순 적 진지</small><b>${MI.killed} / ${WD.targets.length}</b></div><div><small>고지 방어</small><b>${Math.round(MI.def)}%</b></div><div><small>아군 근처 사격</small><b>${MI.ff}회</b></div></div>
    <p>1953년 3월, <mark>윤응렬 소령</mark>이 이끈 한국 공군 F-51 16대가 351고지를 공격하던 적을 공격했어요. 미 공군 T-6 모스키토 정찰기(한국 공군 조종사도 함께 탔어요)와 지상 통제반이 목표를 알려 주었고, 미 해군 함포와 국군 포병이 적 대공포를 눌러 주었어요.</p>
    <p>그 덕분에 <mark>국군 제15사단</mark>이 351고지를 지켜 냈어요. 공군·해군·육군, 그리고 한국과 미국이 힘을 합친 합동작전이었어요.</p>`;}
  html+=`<p class="note">게임 속 무전 대화와 지형은 이해를 돕기 위해 새로 꾸민 장면이에요.</p>
    <div class="row"><button class="btn ghost" id="againBtn">다시 출격</button><button class="btn" id="quizBtn">확인 문제 풀기</button></div>`;
  $('debriefBody').innerHTML=html;showScreen('debrief');$('debrief').scrollTop=0;
  $('againBtn').onclick=()=>startMission(G.mkey);$('quizBtn').onclick=()=>{qi=0;score=0;renderQuiz();showScreen('quiz');};}

const QZ={bridge:[
 {q:'승호리 철교가 중요한 목표였던 까닭은 무엇일까요?',o:['평양 시민이 출퇴근하던 다리라서','북한군이 전선으로 군수물자를 나르던 길목이라서','공군 기지와 가장 가까워서'],a:1,e:'북한군은 이 철교로 중동부전선까지 보급품을 실어 날랐어요. 다리를 끊으면 전선의 보급이 막혀요.'},
 {q:'유엔 공군이 500번 넘게 공격해도 다리가 남아 있었던 까닭은?',o:['위장하고 숨겨서 찾고 맞히기 어려워서','다리가 강철보다 단단해서','날씨 때문에 한 번도 출격하지 못해서'],a:0,e:'북한군은 다리를 위장하고 숨겼어요. 높은 곳에서는 정확히 맞히기 어려웠어요.'},
 {q:'1월 15일 작전이 성공한 가장 큰 까닭은 무엇일까요?',o:['더 많은 폭격기가 출격해서','밤에 몰래 공격해서','대공포화를 무릅쓰고 낮게 내려가 정확히 떨어뜨려서'],a:2,e:'게임의 노란 원처럼, 낮을수록 폭탄이 덜 흩어져요. 조종사들은 위험을 알면서도 낮게 내려갔어요.'},
 {q:'생각해 보기: 이 작전 이야기에서 가장 마음에 남는 것은 무엇인가요?',o:['포기하지 않고 방법을 바꾼 점','목숨을 걸고 임무를 해낸 조종사들의 용기','전쟁이 다시는 없어야 한다는 생각'],a:-1,e:'정답이 없는 질문이에요. 친구와 이유를 나누어 보세요. 승리 뒤에는 늘 많은 사람의 희생과 아픔이 함께 있었다는 것도 기억해요.'}],
 hill:[
 {q:'351고지 작전에서 비행기는 누구를 도왔나요?',o:['산 위에서 고지를 지키던 국군','바다에서 고기를 잡던 어부','길을 잃은 다른 비행기'],a:0,e:'비행기가 땅에서 싸우는 국군을 가까이에서 도왔어요. 이것을 근접항공지원이라고 해요.'},
 {q:'작은 비행기 모스키토는 적이 있는 곳을 어떻게 알려 주었나요?',o:['큰 소리로 외쳐서','흰 연기를 쏘아서','깃발을 흔들어서'],a:1,e:'모스키토가 흰 연기를 쏘면, 전투기 조종사들은 그 연기를 보고 공격할 곳을 찾았어요.'},
 {q:'조종사가 공격하기 전에 꼭 확인해야 했던 것은?',o:['구름의 모양','비행기의 색깔','우리 편이 있는 곳'],a:2,e:'우리 편과 적이 아주 가까이 있었어요. 그래서 주황색 천 같은 표시로 우리 편 위치를 꼭 확인했어요.'},
 {q:'생각해 보기: 공군, 해군, 육군이 함께한 이 작전에서 배울 점은?',o:['서로 믿고 역할을 나누는 협력','정확하게 알려 주는 소통','혼자보다 함께하는 힘'],a:-1,e:'정답이 없는 질문이에요. 우리 반에서 협력이 필요했던 경험과도 이어서 이야기해 보세요.'}]};
let qi=0,score=0;
function renderQuiz(){const Q=QZ[G.mkey],it=Q[qi];
  $('quizBody').innerHTML=`<h2>확인 문제 ${qi+1} / ${Q.length}</h2><p class="date">${it.a<0?'정답 없는 질문':'알맞은 답을 고르세요'}</p><p>${it.q}</p>
   <div>${it.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div class="fb" id="fb"></div>
   <div class="row"><span></span><button class="btn" id="qNext" style="visibility:hidden">${qi===Q.length-1?'마치기':'다음 문제'}</button></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if($('qNext').style.visibility==='visible')return;const i=+b.dataset.i;
    if(it.a<0)b.classList.add('ok');else if(i===it.a){b.classList.add('ok');score++;}else{b.classList.add('no');document.querySelector(`.opt[data-i="${it.a}"]`).classList.add('ok');}
    $('fb').textContent=it.e;$('qNext').style.visibility='visible';});
  $('qNext').onclick=()=>{if(qi<Q.length-1){qi++;renderQuiz();}else{$('quizBody').innerHTML=`<div class="stamp">완료</div><h2>작전 기록 완료</h2><p class="date">확인 문제 ${score} / 3 정답</p>
    <p>${G.mkey==='bridge'?'승호리 철교 차단작전은 한국 공군이 스스로의 힘으로 큰 작전을 해낸 사례로 기억돼요.':'351고지 작전은 하늘과 땅, 여러 나라가 함께 고지를 지켜 낸 합동작전으로 기억돼요.'}</p>
    <div class="row"><button class="btn ghost" id="again2">다시 출격</button><button class="btn" id="toSel">다른 작전 고르기</button></div>`;
    $('again2').onclick=()=>startMission(G.mkey);$('toSel').onclick=toSelect;}};}

/* ---------- loop ---------- */
let last=performance.now(),hudT=0;
function winCruise(dt){EZ.pit=Math.min(EZ.pit+dt*.35,.3);EZ.bank*=Math.exp(-dt*2);eul.set(EZ.pit,EZ.yaw,-EZ.bank,'YXZ');PL.q.setFromEuler(eul);
  PL.pos.addScaledVector(fwdOf(PL.q),PL.v*dt);PL.pos.y=Math.max(PL.pos.y,groundY(PL.pos.x,PL.pos.z)+30);PL.mesh.position.copy(PL.pos);PL.mesh.quaternion.copy(PL.q);}
function loop(now){requestAnimationFrame(loop);try{frame(now);}catch(e){console.error(e);if(!loop.err){loop.err=1;toast('잠깐 문제가 생겼어요',String(e&&e.message||e).slice(0,70),6000);}
  if(G.mode==='ending'||G.mode==='play'){G.mode='ending';G.result=G.result||'ammo';debrief();}}}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.mode==='play'||G.mode==='ending'){G.t+=dt;
    if(G.mode==='play'){flight(dt);}
    if(G.mode==='ending'&&G.result==='win'){if(!G.easy)syncEZ();winCruise(dt);}
    if(G.mode!=='pause'){updWing(dt);updMission(dt);updGuns(dt);updProjs(dt);updParts(dt);updRadio(dt);G.cool-=dt;
      spinProps(dt,[PL.mesh,...wing,WD.mos]);updCam(dt);updRing();hudT-=dt;if(hudT<=0){hudT=.1;updHUD();}engineSet(G.mode==='play'||G.result==='win');}
    if(G.mode==='ending'){G.endT-=dt;if(G.endT<=0||performance.now()-G.endAt>7000)debrief();}
    draw2D(dt);}
  else if(G.mode==='pause'){}
  else{attract(dt);updParts(dt);hx.clearRect(0,0,W,H);}
  R.render(scene,cam);}
resize();buildWorld('bridge');$('loading').style.display='none';requestAnimationFrame(loop);
window.__G=G;window.__PL=PL;window.__start=startMission;
})();
</script></body></html>
